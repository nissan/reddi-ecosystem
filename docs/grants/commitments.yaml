schemaVersion: 2
auditAsOf: 2026-08-26
lastAmendedAt: 2026-09-01
ledgerRevisedAt: 2026-09-01
dateSemantics:
  auditAsOf: date of the last full audit sweep across every commitment.
  lastAmendedAt: date of the most recent amendment to individual commitments; evidence
    rows added after auditAsOf carry their own inline observation date.
statusVocabulary: [verified, partial, planned, blocked, superseded, unknown]
rules:
  - existence of code is not release evidence
  - issue creation is not delivery evidence
  - devnet is not mainnet
  - owned demos are not automatically external integrations
  - test or synthetic volume is never grant-eligible volume
  - no recovery task authorizes live spend, outreach, or publication
  - Solana rails with AUDD payments are the first concrete payment implementation and acceptance-evidence profile for Solana Superteam Australia and AUDD obligations
  - x402, MPP, AP2, ACP/UCP, Stripe-style, and other standards remain comparison fixtures or later adapters until the Solana/AUDD acceptance pack is reviewed, except where a recorded grantor obligation requires specific evidence from one of them
  - programme sequencing rules never retire or soften a recorded grantor obligation; retiring or softening an obligation row requires a re-read of its governing text recorded as evidence, while adding a gap, control, or acceptance artifact does not

