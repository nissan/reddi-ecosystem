schemaVersion: 2
asOf: 2026-08-26
lastAmendedAt: 2026-10-03
dateSemantics:
  asOf: date of the last full sweep across every repository entry.
  lastAmendedAt: date of the most recent amendment to individual entries; evidence
    rows added after asOf carry their own inline checkedAt date.
repositories:
  - id: ecosystem
    url: https://github.com/nissan/reddi-ecosystem
    state: active-public
    visibility: public
    canonicalFor:
      - portfolio roadmap and dependency graph
      - cross-repository architecture decisions
      - grant evidence index and portfolio claim registry
      - research provenance and prompt-foundry governance
      - upstream/community/commercial covenants
    mustNotOwn:
      - ADL semantic definitions
      - RAP implementation code
      - Arena rules or implementation
    observedEvidence:
      - path: evidence/github/ECO-001-2026-08-31.md
        observation: ECO-001 captured public GitHub state for default branch, release/tag, CI, branch protection, milestone, PR, issue, deployment, package-evidence gaps, and 2026-09-01 package/release/upstream corrections. In-repository artifact; it has no published URL until the ECO-001 branch is merged.
        checkedAt: 2026-09-01

  - id: adl-lab
    url: https://github.com/nissan/reddiagent-lab
    state: active
    visibility: public
    canonicalFor:
