schemaVersion: 2
programme: Reddi Ecosystem
asOf: 2026-08-26
lastAmendedAt: 2026-09-01
sequencingRevisedAt: 2026-08-31
dateSemantics:
  asOf: date of the last full sweep across every node.
  lastAmendedAt: date of the most recent amendment to individual nodes; nodes amended
    after asOf carry their own inline evidence dates.
canonicalRule: This file owns cross-repository dependencies; component repositories own their implementation.
dependencyEdgeTypes:
  dependsOn: completion prerequisite between graph nodes
  externalIssue: canonical component implementation or pre-existing work link
  humanGates: non-automatable approval or external-authority prerequisite
railFieldTypes:
  railRole: side of the rail-neutrality boundary a node sits on; ECO-042 is the captain-approved first-implementation node and the only node that may declare first-implementation, while every comparison-fixture node must depend on the ECO-047 acceptance pack
  railProfile: concrete rail the node implements; requires an explicit railRole and solana-audd is reserved for the single first-implementation node
  comparisonStandards: rails a node contract-tests as comparison fixtures; requires an explicit railRole and never lists the first-implementation profile
  adapterMethods: normalized payment adapter operations; ECO-041 must declare the complete supported vocabulary structurally rather than relying on prose mentions
statusVocabulary: [ready, in-progress, blocked, planned, done, superseded]
priorityVocabulary: [P0, P1, P2, P3]
railRoleVocabulary: [rail-neutral-core, first-implementation, comparison-fixture]
railProfileVocabulary: [solana-audd, mpp, ap2, x402, stripe-style, second-chain, deterministic-fake]
humanGates:
  - repo-creation
  - external-publication
  - upstream-contact
  - legal-or-grantor-communication
  - privacy-publication
  - live-payment
  - mainnet
  - signing-or-custody
  - production-release
  - paid-service-or-spend

epics:
  - id: E00
    title: Evidence recovery and grant truth
    milestone: M0
    targetRepo: ecosystem
    outcome: Every past commitment and current claim has governing text, reproducible evidence, gap, owner role, status, and decision.
  - id: E01
    title: Programme control plane and governance
    milestone: M1
    targetRepo: ecosystem
    outcome: Humans and agents can navigate one dependency-correct public roadmap without displacing component truth.
  - id: E02
    title: Research intelligence and prompt foundry
    milestone: M1
    targetRepo: ecosystem
    outcome: Research becomes evaluated prompts, agents, tools, experiments, and decisions through a reproducible improvement loop.
  - id: E03
    title: ADL portability and Agent Bill of Materials
    milestone: M2
    targetRepo: adl-lab
    outcome: An agent and its deployed dependency/authority surface can be defined, projected, inspected, and tested without provider or product lock-in.
  - id: E04
    title: RAP lifecycle, events, and rail neutrality
    milestone: M2
    targetRepo: rap
    outcome: The same economic work lifecycle and receipts operate across replaceable transports, chains, assets, and conventional payment rails.
  - id: E05
    title: Arena conformance, evaluation, and learning loops
    milestone: M2
    targetRepo: arena
    outcome: Arena supplies deterministic and adversarial evidence that improves ADL and RAP without redefining either locally.
  - id: E06
    title: Reddi Arena for Buzz and Nostr
    milestone: M3
    targetRepo: ecosystem
    outcome: A community can run and inspect a no-spend Arena lifecycle inside an upstream-compatible Buzz workspace.
  - id: E07
    title: Reddi Pack for Omarchy Quattro
    milestone: M4
    targetRepo: ecosystem
    outcome: A hacker can safely add a thin Quattro cockpit and signed Reddi services to a supported Omarchy machine.
  - id: E08
    title: Reddi Machine distribution
    milestone: M5
    targetRepo: ecosystem
    outcome: A reproducible, recoverable, secure whole-machine developer/node preview can be installed and maintained.
  - id: E09
    title: Lighthouse hosted services and sustainable revenue
    milestone: M6
    targetRepo: ecosystem
    outcome: Optional managed operations deliver measurable value and revenue without making the open protocol dependent on them.
  - id: E10
    title: Homebrew community and upstream reciprocity
    milestone: M7
    targetRepo: ecosystem
    outcome: Independent AI, Linux, Nostr, and blockchain contributors learn, build, operate, review, and contribute upstream.
  - id: E11
    title: Security, privacy, supply chain, and production readiness
    milestone: M8
    targetRepo: ecosystem
    outcome: Releases and live economic claims are bounded, reproducible, recoverable, independently reviewed, and approved by humans.

nodes:
  - id: ECO-000
    epic: E00
    type: issue
    title: Recover governing grant documents and amendments
    milestone: M0
    targetRepo: ecosystem
    githubProjection: implementation
    status: ready
    priority: P0
    dependsOn: []
    ownerRole: programme lead
    outcome: A source register distinguishes binding commitments, proposals, targets, amendments, and acceptance authorities.
    acceptance:
      - Every grant/target row links to authoritative governing text or is explicitly marked unavailable.
      - Due dates, acceptance authority, amendments, confidentiality, and reporting obligations are extracted without interpretation drift.
    subtasks:
      - Inventory signed agreements, proposals, emails, reports, and amendments.
      - Hash and register private originals without committing confidential content.
      - Publish a privacy-safe derived commitment register for maintainer review.
    evidenceExpected: [source register, document hashes, maintainer review]
    humanGates: [legal-or-grantor-communication, external-publication]

  - id: ECO-001
    epic: E00
    type: issue
    title: Capture reproducible repository, release, package, deployment, and issue snapshots
    milestone: M0
    targetRepo: ecosystem
    githubProjection: implementation
    status: in-progress
    priority: P0
    dependsOn: []
    ownerRole: release auditor
    outcome: A dated evidence index describes the verifiable state of every owned Reddi repository.
    acceptance:
      - Default branch revisions, releases/tags, package metadata, CI/tests, deployments, open milestones, and material issues are captured.
      - Each observation states what it proves, environment, timestamp, and reproducibility command or URL.
    subtasks:
      - Snapshot reddiagent-lab, reddi-agent-protocol, and reddi-arena.
      - Re-run safe clean checks where dependencies are available.
      - Register stale, contradictory, private, or inaccessible evidence as gaps.
    evidenceExpected: [repository inventory, clean-check logs, release and deployment index]
    evidenceProduced:
      - evidence/github/ECO-001-2026-08-31.md records a reproducible public GitHub snapshot for reddi-ecosystem, reddiagent-lab, reddi-agent-protocol, and reddi-arena, plus corrective primary-source package/release/upstream logs and explicit package/export and clean-rerun gaps.
    humanGates: []

  - id: ECO-002
    epic: E00
    type: issue
    title: Verify adoption, npm, integration, workshop, user, and volume measures
    milestone: M0
    targetRepo: ecosystem
    githubProjection: implementation
    status: planned
    priority: P0
    dependsOn: [ECO-000, ECO-001]
    ownerRole: evidence and analytics lead
    outcome: Each quantitative August target has a precise definition, authoritative source, date window, exclusions, and calculated result.
    acceptance:
      - npm downloads, external projects, live integrations, workshop developers, eligible users, and transaction volume are independently calculable.
      - Owned/test/demo/duplicate/refunded/non-eligible activity is visibly excluded.
    subtasks:
      - Define each numerator, denominator, date window, and deduplication rule.
      - Export authoritative registry, analytics, event, integration, and rail evidence.
      - Recalculate and obtain a second-person review.
    evidenceExpected: [metric definitions, source exports, calculation workbook or script, reviewer sign-off]
    humanGates: [privacy-publication]

  - id: ECO-003
    epic: E00
    type: issue
    title: Reconcile Solana and Quasar deployment identities and environment claims
    milestone: M0
    targetRepo: rap
    githubProjection: tracker
    status: planned
    priority: P0
    dependsOn: [ECO-001]
    ownerRole: Solana integration lead
    outcome: One canonical deployment registry explains active, legacy, devnet, test, and any approved mainnet programs.
    acceptance:
      - Program IDs, source revisions, networks, upgrade authorities, deployment dates, and proof claims reconcile.
      - MagicBlock PER, Quasar, legacy Anchor, and mainnet claims cannot be confused in docs or evidence exports.
    subtasks:
      - Validate canonical config against repository history and read-only chain observations.
      - Classify every discovered program ID and remove or annotate stale documentation.
      - Add a machine-checkable deployment registry test in RAP.
    evidenceExpected: [RAP issue or PR, deployment registry, read-only verification log]
    humanGates: [mainnet]

  - id: ECO-004
    epic: E00
    type: issue
    title: Reconcile May-July commitments, August targets, and AUDD release criteria
    milestone: M0
    targetRepo: ecosystem
    githubProjection: implementation
    status: planned
    priority: P0
    dependsOn: [ECO-000, ECO-002, ECO-003]
    externalIssue: https://github.com/nissan/reddi-agent-protocol/issues/615
    ownerRole: grant auditor
    outcome: Every commitment has a reviewed promise/evidence/gap/owner/status row and no outcome is inferred from backlog existence.
    acceptance:
      - "docs/grants/commitments.yaml is complete against recovered governing sources."
      - RAP issues 615-630 are linked to, not duplicated, and their release evidence is evaluated separately.
      - Each AUDD release obligation, including the AUDD-2026-M1 x402 proof, is confirmed or recorded as retired against its governing issue text rather than against programme sequencing preference.
    subtasks:
      - Run the grant-auditor prompt per commitment.
      - Re-read the AUDD issue 615-619 governing text and record each obligation's current standing as evidence.
      - Record contradictions, eligibility questions, and missing external evidence.
      - Obtain programme, technical, and financial review.
    evidenceExpected: [reviewed commitments ledger, exception list, review record]
    humanGates: [legal-or-grantor-communication]

  - id: ECO-005
    epic: E00
    type: issue
    title: Approve remediation and grantor communication decision pack
    milestone: M0
    targetRepo: ecosystem
    githubProjection: implementation
    status: blocked
    priority: P0
    dependsOn: [ECO-004]
    ownerRole: programme sponsor
    outcome: Humans decide which gaps to prove, remediate, renegotiate, disclose, or retire and on what dates.
    acceptance:
      - Every partial, blocked, or unknown material commitment has an explicit approved disposition.
      - External wording separates verified delivery facts, limitations, and future forecasts.
    subtasks:
      - Prepare options with cost, risk, dependencies, and realistic dates.
      - Obtain legal/grantor and maintainer approval as applicable.
      - Record decisions and create only the approved remediation nodes.
    evidenceExpected: [signed decision record, approved communication, updated graph]
    humanGates: [legal-or-grantor-communication, external-publication, paid-service-or-spend]

  - id: ECO-010
    epic: E01
    type: issue
    title: Create and publish the public reddi-ecosystem repository
    milestone: M1
    targetRepo: ecosystem
    githubProjection: implementation
    status: done
    priority: P0
    dependsOn: []
    ownerRole: repository administrator
    outcome: The locally validated programme control plane is public at nissan/reddi-ecosystem.
    acceptance:
      - Empty public repository exists under the selected owner and default branch protection/permissions are reviewed.
      - Bootstrap files, history, CI, and links render correctly with no secrets or private grant material.
    subtasks:
      - Confirm the empty public GitHub repository and grant the connected GitHub integration contents access.
      - Push validated bootstrap history and enable checks.
      - Verify public clone, links, issue templates, and security contact.
    evidenceExpected: [public repository URL, successful CI run, public-clone verification]
    humanGates: [repo-creation, external-publication]

  - id: ECO-011
    epic: E01
    type: issue
    title: Enforce graph, research, grant, and prompt registry integrity in CI
    milestone: M1
    targetRepo: ecosystem
    githubProjection: implementation
    status: in-progress
    priority: P0
    dependsOn: []
    ownerRole: programme tooling maintainer
    outcome: Invalid dependencies, stale links, malformed evidence, and unregistered prompts fail before merge.
    acceptance:
      - CI validates YAML, unique IDs, acyclic dependencies, canonical repos, milestone references, human gates, URLs, and prompt files.
      - Unit tests cover cycles, orphans, unknown references, missing acceptance, and malformed research entries.
    subtasks:
      - Implement dependency graph linter and tests.
      - Implement research/grant/prompt registry linting.
      - Add GitHub Actions workflow and contributor command documentation.
    evidenceExpected: [tools, unit tests, CI workflow]
    humanGates: []

  - id: ECO-012
    epic: E01
    type: issue
    title: Generate stable GitHub issue projections from canonical graph nodes
    milestone: M1
    targetRepo: ecosystem
    githubProjection: implementation
    status: planned
    priority: P0
    dependsOn: [ECO-011]
    ownerRole: programme tooling maintainer
    outcome: Maintainers can review and publish consistent epic/issue bodies without making GitHub the canonical dependency store.
    acceptance:
      - Generator produces deterministic epic and node Markdown with source IDs and content hashes.
      - Projection distinguishes ecosystem implementation, cross-repo tracker, and existing component issue.
    subtasks:
      - Define generated-file contract and drift marker.
      - Implement deterministic projector and snapshot tests.
      - Document safe create/update/reconcile flow; never auto-close on imported state.
    evidenceExpected: [projector, generated issue set, snapshot tests]
    humanGates: [external-publication]

  - id: ECO-013
    epic: E01
    type: issue
    title: Establish ADR, RFC, claim, decision, and sync-log registers
    milestone: M1
    targetRepo: ecosystem
    githubProjection: implementation
    status: planned
    priority: P1
    dependsOn: [ECO-011]
    ownerRole: architecture steward
    outcome: Consequential decisions, public claims, and divergence from plans remain discoverable and reviewable.
    acceptance:
      - Templates name authority, options, evidence, decision, consequences, expiry/review, and affected graph nodes.
      - Claim register links every quantitative or production claim to dated evidence and audience.
    subtasks:
      - Add ADR/RFC and sync-log templates and indexes.
      - Add claim registry schema and lint.
      - Migrate material bootstrap decisions into records.
    evidenceExpected: [templates, registers, lint tests]
    humanGates: []

  - id: ECO-014
    epic: E01
    type: issue
    title: Publish evidence-backed programme status and roadmap views
    milestone: M1
    targetRepo: ecosystem
    githubProjection: implementation
    status: planned
    priority: P1
    dependsOn: [ECO-004, ECO-012, ECO-013]
    ownerRole: programme product lead
    outcome: Contributors and grant stakeholders can see verified, partial, planned, blocked, superseded, and unknown work without optimistic inference.
    acceptance:
      - Status view is generated from reviewed graph/claim/commitment data with timestamps.
      - Component implementation links resolve to canonical repositories and stale state is visibly marked.
    subtasks:
      - Define public versus private evidence redaction.
      - Generate roadmap, critical path, grant, and upstream views.
      - Run accessibility, clarity, and overclaim review.
    evidenceExpected: [generated status pages, reviewer findings, public link]
    humanGates: [privacy-publication, external-publication]

  - id: ECO-015
    epic: E01
    type: issue
    title: Operate merge-triggered and quarterly portfolio reviews
    milestone: M1
    targetRepo: ecosystem
    githubProjection: implementation
    status: planned
    priority: P1
    dependsOn: [ECO-012, ECO-014]
    ownerRole: programme lead
    outcome: Component merges and elapsed time update dependencies, evidence freshness, priorities, and milestone forecasts.
    acceptance:
      - Review checklist covers parents, blockers, dependents, critical path, claims, grant evidence, and upstream duties.
      - Review outputs are versioned and do not silently overwrite human gates.
    subtasks:
      - Define merge webhook/manual reconciliation flow.
      - Add quarterly review schedule and stale-evidence report.
      - Trial the loop on one merge from each owned component repository.
    evidenceExpected: [review checklist, trial records, updated graph]
    humanGates: []

  - id: ECO-020
    epic: E02
    type: issue
    title: Curate primary-source agent engineering research and decision mappings
    milestone: M1
    targetRepo: ecosystem
    githubProjection: implementation
    status: in-progress
    priority: P0
    dependsOn: []
    ownerRole: research steward
    outcome: Current research is traceable to concrete Reddi controls, experiments, and open questions.
    acceptance:
      - Register covers selected OpenAI, Anthropic, Gemini/Google, ByteDance, Z.ai/GLM, Mistral, xAI, arXiv, Nostr, Buzz, Omarchy, event, and supply-chain sources.
      - Synthesis labels vendor reports, papers, specifications, inference, and unvalidated Reddi hypothesis correctly.
    subtasks:
      - Capture exact primary URLs, dates, relevance, contradictions, and limitations.
      - Map findings to graph/loop/event/context/eval/security controls.
      - Obtain technical review and schedule freshness checks.
    evidenceExpected: [SOURCES.yaml, synthesis, review record]
    humanGates: []

  - id: ECO-021
    epic: E02
    type: issue
    title: Define prompt package, trace, dataset, and evaluation governance
    milestone: M1
    targetRepo: ecosystem
    githubProjection: implementation
    status: planned
    priority: P0
    dependsOn: [ECO-020]
    ownerRole: evaluation lead
    outcome: Prompts are versioned, reproducible, privacy-safe artifacts with locked evaluation and rollback rules.
    acceptance:
      - Schema covers contract, context, tools, authority, data, metrics, baseline, candidate, reviewer, and rollback.
      - Policy prevents training/held-out leakage, secret capture, hidden-reasoning storage, and optimizer self-approval.
    subtasks:
      - Define prompt/eval/trace manifests and redaction classes.
      - Define dataset versioning, split, retention, consent, and contamination controls.
      - Add schema validation and example package.
    evidenceExpected: [schemas, policy, example, lint tests]
    humanGates: [privacy-publication]

  - id: ECO-022
    epic: E02
    type: issue
    title: Baseline the role prompt catalog on representative programme tasks
    milestone: M1
    targetRepo: ecosystem
    githubProjection: implementation
    status: planned
    priority: P1
    dependsOn: [ECO-021]
    ownerRole: prompt foundry maintainer
    outcome: Each bootstrap role has measured strengths, failures, cost, latency, and safe stop behavior.
    acceptance:
      - Every registered prompt has development, held-out, adversarial, and safety cases across at least two runtime/model profiles where practical.
      - Results score final outcomes, unsupported claims, authority violations, cost, latency, and variance.
    subtasks:
      - Build representative fixtures from past Reddi work without leaking private data.
      - Run baselines and independently review failures.
      - Register regression cases and retain rollback versions.
    evidenceExpected: [eval manifests, scored results, failure register]
    humanGates: [paid-service-or-spend]

  - id: ECO-023
    epic: E02
    type: issue
    title: Build sandboxed prompt candidate optimization with guard-metric rollback
    milestone: M1
    targetRepo: ecosystem
    githubProjection: implementation
    status: planned
    priority: P1
    dependsOn: [ECO-021, ECO-022]
    ownerRole: prompt foundry maintainer
    outcome: Diagnosed failures can produce better prompt candidates without weakening authority, safety, or held-out integrity.
    acceptance:
      - Candidate generation cannot change permissions, gates, metrics, labels, or held-out sets.
      - Promotion requires improvement on primary metrics, no guard regression, human review, versioning, and tested rollback.
    subtasks:
      - Implement baseline/candidate sandbox runner and budget limits.
      - Add GEPA/SPEAR/SePO-inspired candidate adapters behind one evaluation contract.
      - Test intentional task, safety, cost, and latency regressions.
    evidenceExpected: [optimizer harness, evaluation record, rollback test]
    humanGates: [paid-service-or-spend]

  - id: ECO-024
    epic: E02
    type: issue
    title: Establish provider and runtime compatibility matrix
    milestone: M1
    targetRepo: ecosystem
    githubProjection: implementation
    status: planned
    priority: P1
    dependsOn: [ECO-021]
    ownerRole: agent portability lead
    outcome: Base roles remain provider-neutral while documented overlays capture real model/tool differences.
    acceptance:
      - Matrix tests tool calling, structured output, context, retries, rate/concurrency behavior, cost and safe-stop behavior.
      - Provider overlays cannot alter portable outcomes, effective authority, or evaluation criteria.
    subtasks:
      - Define capability rather than vendor-based test profiles.
      - Run affordable fixtures across selected OpenAI, Anthropic, Gemini, ByteDance/GLM/Mistral/xAI-accessible profiles.
      - Record unsupported/unknown claims without requiring every provider at launch.
    evidenceExpected: [compatibility matrix, adapter records, conformance results]
    humanGates: [paid-service-or-spend]

  - id: ECO-025
    epic: E02
    type: issue
    title: Run periodic research-to-eval and failure-to-improvement loops
    milestone: M1
    targetRepo: ecosystem
    githubProjection: implementation
    status: planned
    priority: P2
    dependsOn: [ECO-023, ECO-024]
    ownerRole: research steward
    outcome: New research and observed failures change the system only through measured artifacts.
    acceptance:
      - Quarterly scan records added, rejected, contradicted, and superseded sources and resulting nodes.
      - Production/CI failures are triaged into test, tool, context, prompt, architecture, or no-change decisions.
    subtasks:
      - Define source freshness and model-version watch rules.
      - Add retrospective intake and evaluation backlog.
      - Publish privacy-safe change notes and rejected-hypothesis log.
    evidenceExpected: [review cadence, retrospectives, eval backlog]
    humanGates: [external-publication]

  - id: ECO-030
    epic: E03
    type: issue
    title: Audit ADL v0.2 portability gaps against Buzz, Quattro, hosted, and multi-rail projections
    milestone: M2
    targetRepo: adl-lab
    githubProjection: tracker
    status: planned
    priority: P0
    dependsOn: [ECO-020]
    ownerRole: ADL specification steward
    outcome: Environment-specific needs become conformance findings or canonical ADL proposals rather than local semantic forks.
    acceptance:
      - Gap matrix covers identity, capabilities, tools, events, memory, evidence, evaluation, budgets, authority, deployment, and recovery.
      - Each gap is resolved as existing semantics, profile/extension, canonical proposal, or non-ADL concern.
    subtasks:
      - Run architecture scenarios through canonical ADL v0.2 schema/docs.
      - File structured findings in reddiagent-lab with minimal reproducible examples.
      - Record downstream workarounds only with expiry and upstream link.
    evidenceExpected: [compatibility report, upstream issues, accepted classifications]
    humanGates: []

  - id: ECO-031
    epic: E03
    type: issue
    title: Define and generate an Agent Bill of Materials and Dependency Graph
    milestone: M2
    targetRepo: adl-lab
    githubProjection: tracker
    status: planned
    priority: P0
    dependsOn: [ECO-030]
    ownerRole: ADL tooling maintainer
    outcome: Operators can inspect the prompts, models, runtimes, tools, skills, connectors, data, policies, evaluators, and authorities that form an agent.
    acceptance:
      - Canonical schema represents direct/transitive dependency identity, version/digest, provenance, license, permission, and runtime discovery.
      - Generator produces deterministic JSON plus a human-readable dependency graph and flags undeclared effective dependencies.
    subtasks:
      - Specify Agent BOM and dependency-edge types through ADL governance.
      - Build generator and fixtures for local, Buzz, Quattro, and Lighthouse projections.
      - Add prompt-to-tool and connector permission risk checks.
    evidenceExpected: [canonical proposal, schema, generator, conformance tests]
    humanGates: []

  - id: ECO-032
    epic: E03
    type: issue
    title: Version portable deployment projection and overlay contracts
    milestone: M2
    targetRepo: adl-lab
    githubProjection: tracker
    status: planned
    priority: P0
    dependsOn: [ECO-030]
    ownerRole: ADL specification steward
    outcome: Provider, Buzz, Quattro, container, and hosted overlays can add configuration without changing portable identity or semantics.
    acceptance:
      - Overlay merge rules, forbidden overrides, version negotiation, provenance, and validation errors are canonical and tested.
      - Round-trip/diff output exposes changes to capabilities, tools, budget, authority, evaluators, or identity.
    subtasks:
      - Define base/profile/deployment overlay precedence.
      - Add positive and malicious override fixtures.
      - Validate at least three materially different projections.
    evidenceExpected: [ADL proposal, fixtures, conformance report]
    humanGates: []

  - id: ECO-033
    epic: E03
    type: issue
    title: Add prompt, context, evaluation, and trace manifests to portable agent profiles
    milestone: M2
    targetRepo: adl-lab
    githubProjection: tracker
    status: planned
    priority: P1
    dependsOn: [ECO-021, ECO-030]
    ownerRole: ADL evaluation steward
    outcome: An agent definition names reproducible prompt/eval artifacts without embedding provider secrets or private traces.
    acceptance:
      - Manifest references version/digest, compatibility, data policy, metrics, baseline, and promotion state.
      - Trace declaration records permitted summaries/provenance and prohibits secrets/hidden reasoning persistence.
    subtasks:
      - Map prompt-foundry schema to canonical ADL extension/profile rules.
      - Add conforming and non-conforming fixtures.
      - Test missing, stale, altered, and provider-overlay manifests.
    evidenceExpected: [canonical profile, fixtures, validation results]
    humanGates: [privacy-publication]

  - id: ECO-034
    epic: E03
    type: issue
    title: Make identity, budget, payment authority, and human gates explicit in ADL profiles
    milestone: M2
    targetRepo: adl-lab
    githubProjection: tracker
    status: planned
    priority: P0
    dependsOn: [ECO-030]
    ownerRole: identity and authority steward
    outcome: Declared agent capability cannot be mistaken for signer, wallet, custody, spend, release, or publication authority.
    acceptance:
      - Profiles declare authority source, scope, limits, expiry, approval, revocation, recovery, and auditable decision evidence.
      - Conformance rejects implicit wallet keys, unlimited spend, model-self-approval, and environment promotion.
    subtasks:
      - Define authority and human-gate vocabulary through ADL governance.
      - Add no-spend/devnet/live/mainnet fixtures and fail-closed tests.
      - Align RAP and deployment projection bindings.
    evidenceExpected: [canonical proposal, threat-model review, conformance tests]
    humanGates: [signing-or-custody, live-payment, mainnet]

  - id: ECO-035
    epic: E03
    type: issue
    title: Demonstrate multi-provider and multi-runtime ADL conformance
    milestone: M2
    targetRepo: adl-lab
    githubProjection: tracker
    status: planned
    priority: P1
    dependsOn: [ECO-031, ECO-032, ECO-033, ECO-034, ECO-024]
    ownerRole: conformance lead
    outcome: One portable agent produces equivalent declared outcomes and boundaries in heterogeneous runtimes.
    acceptance:
      - At least two materially different model providers/runtimes and one deterministic validator pass the same conformance pack.
      - Differences are captured as capability/profile evidence, not hidden prompt branches.
    subtasks:
      - Select a no-spend task with deterministic outcome and tool use.
      - Execute conformance matrix and compare Agent BOMs/effective authority.
      - File specification and adapter findings in canonical repositories.
    evidenceExpected: [conformance pack, run records, finding register]
    humanGates: [paid-service-or-spend]

  - id: ECO-040
    epic: E04
    type: issue
    title: Audit RAP core for transport, chain, asset, standards, and provider leakage
    milestone: M2
    targetRepo: rap
    githubProjection: tracker
    status: planned
    priority: P0
